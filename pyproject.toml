[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brasaland-supplier-directory"
version = "0.1.0"
description = "TinyDB storage and seed command for the Brasaland supplier directory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9",
    "tinydb>=4.8,<5",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
test = ["httpx>=0.28,<1.0"]

[project.scripts]
seed = "services.api.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["services"]
