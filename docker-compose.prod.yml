services:
  api:
    command:
      - uvicorn
      - services.api.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uis:
    environment:
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      DATABASE_URL: ""
      JWT_SECRET_KEY: ""
      RESEND_API_KEY: ""
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
