x-services-build: &services-build
  context: ./services
  dockerfile: Dockerfile
  additional_contexts:
    packages: ./packages
    scripts: ./scripts
    data: ./data

services:
  # Broker and result backend of Celery (ticket DEV-55). noeviction: Redis never
  # drops queued messages to free memory; appendonly keeps them across restarts.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - brasaland

  api:
    build: *services-build
    ports:
      - "8000:8000"
    env_file:
      - path: ${API_ENV_FILE:-./.env}
        required: false
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - brasaland

  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_PORT:-3001}:3000"
      - "${WEBSITE_PORT:-3000}:5174"
    env_file:
      - path: ${UIS_ENV_FILE:-./.env}
        required: false
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      WATCHPACK_POLLING: ${WATCH_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-true}
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      - uis_website_node_modules:/app/website/node_modules
      - uis_website_next:/app/website/.next
      - uis_backoffice_node_modules:/app/backoffice/node_modules
      - uis_backoffice_next:/app/backoffice/.next
    command:
      - sh
      - -c
      - |
        (
          cd /app/website
          npm run dev -- --host 0.0.0.0 --port 5174 2>&1 | while IFS= read -r line; do printf '[website] %s\n' "$$line"; done
        ) &
        website_pid=$!
        (
          cd /app/backoffice
          npm run dev -- --hostname 0.0.0.0 --port 3000 2>&1 | while IFS= read -r line; do printf '[backoffice] %s\n' "$$line"; done
        ) &
        backoffice_pid=$!
        trap 'kill "$$website_pid" "$$backoffice_pid" 2>/dev/null || true' HUP INT TERM
        wait
    networks:
      - brasaland

  # Nightly jobs (ticket DEV-53): cron in its own container, never in the API
  # process. Schedule in scripts/scheduler/crontab (02:00 UTC every day).
  scheduler:
    build:
      context: ./scripts
      dockerfile: scheduler/Dockerfile
      additional_contexts:
        services: ./services
        data: ./data
    env_file:
      - path: ${API_ENV_FILE:-./.env}
        required: false
    environment:
      TZ: UTC
    volumes:
      # The CSV backups and the pipeline snapshots stay on the host.
      - ./data/raw:/app/data/raw
      - ./data/eval:/app/data/eval
    networks:
      - brasaland

  # Celery worker (ticket DEV-55): consumes the Redis queue in its own process,
  # never inside FastAPI. Stopping the API does not stop it nor lose messages.
  worker:
    build: *services-build
    command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: ${API_ENV_FILE:-./.env}
        required: false
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./data:/app/data
    # Give a running task time to finish (warm shutdown) before the kill.
    stop_grace_period: 60s
    networks:
      - brasaland

  # Flower: monitoring of the Celery queue during development (http://localhost:5555).
  flower:
    build: *services-build
    command: ["celery", "-A", "services.celery_app", "flower", "--port=5555"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - brasaland

networks:
  brasaland:
    name: brasaland
    driver: bridge

volumes:
  redis_data:
  uis_website_node_modules:
  uis_website_next:
  uis_backoffice_node_modules:
  uis_backoffice_next:
